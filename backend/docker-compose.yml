services:
  backend:
    build: .
    container_name: backend-api
    restart: always

    ports:
      - "3001:3000"

    volumes:
      - .:/app
      - /app/node_modules

    env_file:
      - .env.docker

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
